<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314120e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e23d3d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="mark" id="mark">Games</p>
        <p class="tag" id="tag">Pick a game, set your name, then host or join.</p>
      </div>
      <label class="name-label">
        Name
        <input id="name" maxlength="16" placeholder="Player" autocomplete="nickname" />
      </label>
      <p class="code" id="code" hidden></p>
    </header>

    <section class="lobby" id="lobby">
      <form id="setup">
        <div class="pick" id="pick">
          <button type="button" class="game-card on" data-game="snake" id="pick-snake" aria-pressed="true">
            <span class="game-name">Snake</span>
            <span class="game-meta">Up to 4</span>
          </button>
          <button type="button" class="game-card" data-game="ttt" id="pick-ttt" aria-pressed="false">
            <span class="game-name">Tic Tac Toe</span>
            <span class="game-meta">2 players</span>
          </button>
          <button type="button" class="game-card" data-game="stealth" id="pick-stealth" aria-pressed="false">
            <span class="game-name">Stealth</span>
            <span class="game-meta">1v1 or bot</span>
          </button>
        </div>
        <div class="row">
          <button type="button" id="host" class="primary">Host public</button>
        </div>
        <div class="row join">
          <input id="room" maxlength="4" placeholder="Code" aria-label="Room code" autocapitalize="characters" />
          <button type="button" id="join">Join</button>
        </div>
        <p class="note" id="blurb">Pick a game to host. Join a row below, or enter a code for the game you picked.</p>
        <p class="error" id="error" hidden></p>
        <p class="list-title">Open games</p>
        <ul class="games" id="games"></ul>
        <p class="empty" id="games-empty">No public games right now.</p>
      </form>
      <div id="waiting" hidden>
        <ol class="players" id="players"></ol>
        <button type="button" id="start" class="primary" hidden>Start</button>
        <p class="wait" id="wait">Waiting for the host.</p>
      </div>
    </section>

    <section class="play" id="play" hidden>
      <div class="board-wrap">
        <div class="stage" id="snake-stage">
          <canvas id="board" width="480" height="480"></canvas>
        </div>
        <div class="stage" id="stealth-stage" hidden>
          <canvas id="stealth" width="640" height="640"></canvas>
        </div>
        <div class="stage" id="ttt-stage" hidden>
          <div class="ttt" id="grid">
            <button type="button" data-i="0" aria-label="Top left"></button>
            <button type="button" data-i="1" aria-label="Top"></button>
            <button type="button" data-i="2" aria-label="Top right"></button>
            <button type="button" data-i="3" aria-label="Left"></button>
            <button type="button" data-i="4" aria-label="Center"></button>
            <button type="button" data-i="5" aria-label="Right"></button>
            <button type="button" data-i="6" aria-label="Bottom left"></button>
            <button type="button" data-i="7" aria-label="Bottom"></button>
            <button type="button" data-i="8" aria-label="Bottom right"></button>
          </div>
        </div>
        <p class="banner" id="banner" hidden></p>
      </div>
      <aside>
        <ol class="players" id="score"></ol>
        <p class="help" id="help">Arrows or WASD. Most fruits wins. Dead snakes stay on the grid.</p>
        <div class="pad" id="pad">
          <button type="button" data-dir="up" aria-label="Up">↑</button>
          <button type="button" data-dir="left" aria-label="Left">←</button>
          <button type="button" data-dir="down" aria-label="Down">↓</button>
          <button type="button" data-dir="right" aria-label="Right">→</button>
        </div>
        <button type="button" id="again" class="primary" hidden>Play again</button>
      </aside>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script type="module" src="main.js?v=30"></script>
  </body>
</html>
